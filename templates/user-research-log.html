<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rihlah — User Research Log</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #1c1917; background: #fff; padding: 48px; line-height: 1.6; }
  h1 { font-size: 24px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 14px; color: #78716c; margin-bottom: 48px; }
  h2 { font-size: 16px; font-weight: 600; margin: 48px 0 16px; text-transform: uppercase; letter-spacing: 1.5px; color: #b87a56; }
  .summary { background: #f5f1ea; padding: 24px; margin-bottom: 48px; }
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  .summary-item label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #57534e; display: block; margin-bottom: 4px; }
  .summary-item .value { font-size: 15px; color: #1c1917; border-bottom: 1px solid #e7e2da; padding-bottom: 4px; min-height: 24px; }
  .summary-list { margin-top: 16px; }
  .summary-list label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #57534e; display: block; margin-bottom: 8px; }
  .summary-list ol { padding-left: 20px; font-size: 14px; color: #57534e; }
  .summary-list li { margin-bottom: 4px; }
  .entry { border: 1px solid #e7e2da; padding: 24px; margin-bottom: 24px; page-break-inside: avoid; }
  .entry-header { display: flex; gap: 24px; margin-bottom: 16px; flex-wrap: wrap; }
  .entry-field { flex: 1; min-width: 150px; }
  .entry-field label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #57534e; display: block; margin-bottom: 4px; }
  .entry-field .value { font-size: 14px; border-bottom: 1px solid #e7e2da; padding-bottom: 4px; min-height: 20px; }
  .entry-question { margin-top: 16px; }
  .entry-question label { font-size: 12px; font-weight: 600; color: #1c1917; display: block; margin-bottom: 6px; }
  .entry-question .answer { border: 1px solid #e7e2da; padding: 12px; min-height: 60px; font-size: 14px; color: #57534e; }
  .entry-number { font-size: 11px; font-weight: 600; color: #b87a56; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .note { font-size: 12px; color: #a8a29e; margin-top: 32px; font-style: italic; }
  @media print { body { padding: 24px; } .entry { page-break-inside: avoid; } }
</style>
</head>
<body>

<h1>Rihlah — User Research Log</h1>
<p class="subtitle">Every conversation with a potential user goes here. 10 conversations will tell you more than 10,000 lines of code.</p>

<div class="summary">
  <h2 style="margin-top:0">Summary</h2>
  <div class="summary-grid">
    <div class="summary-item">
      <label>Total interviews</label>
      <div class="value"></div>
    </div>
    <div class="summary-item">
      <label>Most requested feature</label>
      <div class="value"></div>
    </div>
    <div class="summary-item">
      <label>Willingness to pay range</label>
      <div class="value"></div>
    </div>
    <div class="summary-item">
      <label>Key insight</label>
      <div class="value"></div>
    </div>
  </div>
  <div class="summary-list">
    <label>Common pain points</label>
    <ol>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
    </ol>
  </div>
</div>

<div class="entry">
  <div class="entry-number">Interview 1</div>
  <div class="entry-header">
    <div class="entry-field"><label>Date</label><div class="value"></div></div>
    <div class="entry-field"><label>Name / Alias</label><div class="value"></div></div>
    <div class="entry-field"><label>Age / City</label><div class="value"></div></div>
    <div class="entry-field"><label>How often they travel</label><div class="value"></div></div>
  </div>
  <div class="entry-question"><label>Key quote (their words, verbatim)</label><div class="answer"></div></div>
  <div class="entry-question"><label>What pain points did they describe?</label><div class="answer"></div></div>
  <div class="entry-question"><label>Would they pay for Rihlah? For which feature specifically?</label><div class="answer"></div></div>
  <div class="entry-question"><label>What surprised you about this conversation?</label><div class="answer"></div></div>
  <div class="entry-question"><label>Follow-up action</label><div class="answer" style="min-height:30px"></div></div>
</div>

<div class="entry">
  <div class="entry-number">Interview 2</div>
  <div class="entry-header">
    <div class="entry-field"><label>Date</label><div class="value"></div></div>
    <div class="entry-field"><label>Name / Alias</label><div class="value"></div></div>
    <div class="entry-field"><label>Age / City</label><div class="value"></div></div>
    <div class="entry-field"><label>How often they travel</label><div class="value"></div></div>
  </div>
  <div class="entry-question"><label>Key quote (their words, verbatim)</label><div class="answer"></div></div>
  <div class="entry-question"><label>What pain points did they describe?</label><div class="answer"></div></div>
  <div class="entry-question"><label>Would they pay for Rihlah? For which feature specifically?</label><div class="answer"></div></div>
  <div class="entry-question"><label>What surprised you about this conversation?</label><div class="answer"></div></div>
  <div class="entry-question"><label>Follow-up action</label><div class="answer" style="min-height:30px"></div></div>
</div>

<div class="entry">
  <div class="entry-number">Interview 3</div>
  <div class="entry-header">
    <div class="entry-field"><label>Date</label><div class="value"></div></div>
    <div class="entry-field"><label>Name / Alias</label><div class="value"></div></div>
    <div class="entry-field"><label>Age / City</label><div class="value"></div></div>
    <div class="entry-field"><label>How often they travel</label><div class="value"></div></div>
  </div>
  <div class="entry-question"><label>Key quote (their words, verbatim)</label><div class="answer"></div></div>
  <div class="entry-question"><label>What pain points did they describe?</label><div class="answer"></div></div>
  <div class="entry-question"><label>Would they pay for Rihlah? For which feature specifically?</label><div class="answer"></div></div>
  <div class="entry-question"><label>What surprised you about this conversation?</label><div class="answer"></div></div>
  <div class="entry-question"><label>Follow-up action</label><div class="answer" style="min-height:30px"></div></div>
</div>

<p class="note">Duplicate the entry block for each new interview. Update the summary after every 3 conversations.</p>
</body>
</html>
